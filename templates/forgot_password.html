<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INVORA - Reset Password</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #152243 0%, #090e1f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #ffffff;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #0f182e;
      border: 1px solid #1e2c4f;
      border-radius: 16px;
      padding: 38px 34px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45), 0 0 15px rgba(37, 99, 235, 0.1);
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .brand-icon {
      font-size: 1.8rem;
      color: #3b82f6;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .sub {
      font-size: 0.82rem;
      color: #94a3b8;
      margin-bottom: 22px;
    }

    .alert {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.84rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid #22c55e;
      color: #86efac;
    }

    .form-group {
      position: relative;
      margin-bottom: 14px;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 0.9rem;
    }

    .form-control {
      width: 100%;
      background: #17233f;
      border: 1px solid #23355d;
      border-radius: 8px;
      padding: 12px 14px 12px 38px;
      font-size: 0.88rem;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: #3b82f6;
    }

    .btn-submit {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: #1d4ed8;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      font-size: 0.82rem;
      color: #3b82f6;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand-header">
      <i class="fa-solid fa-key brand-icon"></i>
      <h1 class="brand-title">Reset Password</h1>
    </div>
    <p class="sub">Verify your registered account email and set a new password.</p>

    {% if error %}
      <div class="alert alert-error">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>{{ error }}</span>
      </div>
    {% endif %}

    {% if success %}
      <div class="alert alert-success">
        <i class="fa-solid fa-circle-check"></i>
        <span>{{ success }}</span>
      </div>
    {% endif %}

    <form action="/forgot-password" method="POST">
      <div class="form-group">
        <i class="fa-solid fa-envelope input-icon"></i>
        <input 
          type="email" 
          name="email" 
          class="form-control" 
          placeholder="Enter registered email" 
          required
        >
      </div>

      <div class="form-group">
        <i class="fa-solid fa-lock input-icon"></i>
        <input 
          type="password" 
          name="new_password" 
          class="form-control" 
          placeholder="New password (min 6 characters)" 
          required
          minlength="6"
        >
      </div>

      <div class="form-group">
        <i class="fa-solid fa-shield-halved input-icon"></i>
        <input 
          type="password" 
          name="confirm_password" 
          class="form-control" 
          placeholder="Confirm new password" 
          required
          minlength="6"
        >
      </div>

      <button type="submit" class="btn-submit">Update Password</button>
    </form>

    <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
  </div>

</body>
</html>
