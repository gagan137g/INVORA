<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INVORA - Recommended Video Lectures</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f7fb; color: #1e293b; padding: 30px 20px; min-height: 100vh; display: flex; justify-content: center; }
    
    .container { max-width: 900px; width: 100%; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .back-link { color: #2563eb; text-decoration: none; font-weight: 600; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 6px; }
    
    .header-box { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 22px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
    .header-box h1 { font-size: 1.35rem; color: #0f172a; margin-bottom: 4px; }
    .header-box p { font-size: 0.85rem; color: #64748b; }
    
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
    
    .video-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; text-decoration: none; color: inherit; }
    .video-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.06); border-color: #cbd5e1; }
    
    .thumb-wrap { position: relative; width: 100%; height: 140px; background: linear-gradient(135deg, #1e293b, #0f172a); display: flex; align-items: center; justify-content: center; color: #fff; }
    .play-btn { width: 48px; height: 48px; background: #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #fff; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.4); }
    .badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: #fff; font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; }
    
    .card-body { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .card-body h3 { font-size: 0.95rem; font-weight: 600; color: #1e293b; line-height: 1.4; margin-bottom: 8px; }
    .channel-info { font-size: 0.78rem; color: #64748b; display: flex; align-items: center; gap: 6px; }
    
    .open-btn { margin-top: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 8px; background: #eff6ff; color: #2563eb; border-radius: 6px; font-size: 0.82rem; font-weight: 600; border: 1px solid #bfdbfe; transition: all 0.15s; }
    .video-card:hover .open-btn { background: #2563eb; color: #fff; border-color: #2563eb; }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <a href="/dashboard" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Return to Dashboard
      </a>
      
      <!-- PDF Deck Switcher -->
      <div style="display: flex; align-items: center; gap: 8px;">
        <label style="font-size: 0.82rem; font-weight: 600; color: #64748b;">PDF:</label>
        <select onchange="window.location.href='/videos/' + this.value" style="padding: 6px 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.82rem; background: #fff;">
          {% for d in all_docs %}
            <option value="{{ d.id }}" {% if d.id == current_doc_id %}selected{% endif %}>{{ d.file_name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="header-box">
      <div>
        <h1><i class="fa-brands fa-youtube" style="color:#ef4444; margin-right: 8px;"></i> Recommended Video Lectures</h1>
        <p>Curated conceptual lectures and exam breakdown for <strong>{{ doc_name }}</strong></p>
      </div>
    </div>

    <!-- Recommendations Grid -->
    <div class="video-grid">
      {% for v in videos %}
      <a href="{{ v.search_url }}" target="_blank" class="video-card">
        <div class="thumb-wrap">
          <div class="play-btn"><i class="fa-solid fa-play"></i></div>
          <span class="badge">{{ v.tag }}</span>
        </div>
        <div class="card-body">
          <h3>{{ v.topic }}</h3>
          <div class="channel-info">
            <i class="fa-solid fa-circle-check" style="color: #2563eb;"></i>
            <span>{{ v.channel }}</span>
          </div>
          <div class="open-btn">
            Watch Lecture <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </div>
        </div>
      </a>
      {% endfor %}
    </div>
  </div>

</body>
</html>
