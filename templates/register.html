<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INVORA - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 30%, #15223e 0%, #0b1120 75%, #070b14 100%);
            padding: 24px;
            color: #ffffff;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            background: rgba(22, 34, 58, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 44px 38px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(14, 165, 233, 0.08);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .brand-header {
            margin-bottom: 26px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .brand-logo svg {
            width: 32px;
            height: 32px;
            fill: #38bdf8;
            filter: drop-shadow(0 2px 8px rgba(56, 189, 248, 0.4));
        }

        .brand-logo h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #ffffff;
        }

        .brand-header .subtitle {
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .brand-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box svg {
            position: absolute;
            left: 16px;
            width: 18px;
            height: 18px;
            fill: #64748b;
            transition: fill 0.2s;
        }

        .input-box input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            background: rgba(15, 26, 46, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-box input::placeholder {
            color: #64748b;
        }

        .input-box input:focus {
            background: rgba(18, 32, 58, 0.95);
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
        }

        .input-box input:focus + svg,
        .input-box input:focus ~ svg {
            fill: #38bdf8;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #0ea5e9;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 14px;
            box-shadow: 0 10px 24px -4px rgba(14, 165, 233, 0.5);
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background: #38bdf8;
            box-shadow: 0 12px 28px -4px rgba(56, 189, 248, 0.65);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .auth-footer {
            margin-top: 22px;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
        }

        .auth-footer a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand-header">
            <div class="brand-logo">
                <!-- Open Book Icon Matching INVORA Logo -->
                <svg viewBox="0 0 24 24">
                    <path d="M19 1.5H5C3.62 1.5 2.5 2.62 2.5 4v16c0 1.38 1.12 2.5 2.5 2.5h14c1.38 0 2.5-1.12 2.5-2.5V4c0-1.38-1.12-2.5-2.5-2.5zM12 20.25c-.75-.5-1.75-.75-2.75-.75-1.25 0-2.5.38-3.5 1.05V4.75c1-.67 2.25-1.05 3.5-1.05 1.25 0 2.5.38 3.5 1.05v15.5zm7.25.3c-1-.67-2.25-1.05-3.5-1.05-1 0-2 .25-2.75.75V4.75c1-.67 2.25-1.05 3.5-1.05 1.25 0 2.5.38 3.5 1.05v15.8z"/>
                </svg>
                <h1>INVORA</h1>
            </div>
            <p class="subtitle">AI-Powered Personal Learning Assistant</p>
            <h2>Create your account</h2>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/register" method="POST">
            <div class="form-group">
                <div class="input-box">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <input type="text" name="name" placeholder="Full Name" required autocomplete="name">
                </div>
            </div>

            <div class="form-group">
                <div class="input-box">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                    </svg>
                    <input type="email" name="email" placeholder="Email Address" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <div class="input-box">
                    <svg viewBox="0 0 24 24">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                    </svg>
                    <input type="password" name="password" placeholder="Password" required autocomplete="new-password">
                </div>
            </div>

            <button type="submit" class="btn-submit">Register</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="/login">Login</a>
        </div>
    </div>

</body>
</html>
